<svg xmlns="http://www.w3.org/2000/svg" width="160" height="400" viewBox="0 0 160 400">
  <!-- Flower border from the Bling It On! gift bag: camellias hugging the edge, gold stems
       reaching inward with leaves and blossoms. Tiles vertically; mirror it for the other edge. -->
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6dc95"/>
      <stop offset=".55" stop-color="#c99a45"/>
      <stop offset="1" stop-color="#a57826"/>
    </linearGradient>
    <g id="rose" stroke-width="1.3" stroke-linejoin="round">
      <circle cx="0" cy="-12" r="10"/>
      <circle cx="10.4" cy="-6" r="10"/>
      <circle cx="10.4" cy="6" r="10"/>
      <circle cx="0" cy="12" r="10"/>
      <circle cx="-10.4" cy="6" r="10"/>
      <circle cx="-10.4" cy="-6" r="10"/>
      <circle cx="0" cy="0" r="13"/>
      <circle cx="0" cy="-6" r="6"/>
      <circle cx="5.7" cy="-1.9" r="6"/>
      <circle cx="3.5" cy="4.9" r="6"/>
      <circle cx="-3.5" cy="4.9" r="6"/>
      <circle cx="-5.7" cy="-1.9" r="6"/>
      <path d="M0 -1.5a1.5 1.5 0 1 1 -1.5 1.5a3.2 3.2 0 1 0 3.2 -3.2a5 5 0 1 1 -5 5" fill="none"/>
    </g>
    <g id="blossom">
      <circle cx="0" cy="-4.6" r="4" fill="#fff"/>
      <circle cx="4.4" cy="-1.4" r="4" fill="#fff"/>
      <circle cx="2.7" cy="3.7" r="4" fill="#fff"/>
      <circle cx="-2.7" cy="3.7" r="4" fill="#fff"/>
      <circle cx="-4.4" cy="-1.4" r="4" fill="#fff"/>
      <circle r="2.4" fill="#f5a3bf"/>
    </g>
    <path id="leaf" d="M0 0C4 -6 11 -7.5 18 -4.5C12 0.5 5 2.5 0 0Z" fill="url(#gold)"/>
    <path id="petal" d="M0 0C3 -4 8 -4 10 0C7 2 3 2 0 0Z" fill="#fff"/>
    <path id="spark" d="M0 -6C.8 -1 1 -.8 6 0C1 .8 .8 1 0 6C-.8 1 -1 .8 -6 0C-1 -.8 -.8 -1 0 -6Z" fill="url(#gold)"/>
  </defs>

  <!-- stems -->
  <g fill="none" stroke="#c9a052" stroke-width="1.2" stroke-linecap="round">
    <path d="M28 52C58 50 88 47 122 42"/>
    <path d="M32 140C52 137 72 134 96 128"/>
    <path d="M30 236C62 233 96 229 132 222"/>
    <path d="M30 322C52 320 76 316 102 310"/>
  </g>
  <use href="#leaf" transform="translate(50 51) rotate(-28)"/>
  <use href="#leaf" transform="translate(76 48) rotate(24) scale(.9)"/>
  <use href="#leaf" transform="translate(98 45) rotate(-34) scale(.8)"/>
  <use href="#leaf" transform="translate(56 136) rotate(22) scale(.9)"/>
  <use href="#leaf" transform="translate(76 133) rotate(-30) scale(.8)"/>
  <use href="#leaf" transform="translate(54 233) rotate(-26)"/>
  <use href="#leaf" transform="translate(84 230) rotate(26) scale(.85)"/>
  <use href="#leaf" transform="translate(108 226) rotate(-32) scale(.8)"/>
  <use href="#leaf" transform="translate(52 319) rotate(24) scale(.9)"/>
  <use href="#leaf" transform="translate(78 315) rotate(-28) scale(.8)"/>

  <use href="#blossom" transform="translate(126 41)"/>
  <use href="#blossom" transform="translate(100 127) scale(.85)"/>
  <use href="#blossom" transform="translate(136 221)"/>
  <use href="#blossom" transform="translate(106 309) scale(.85)"/>

  <!-- loose blossoms, petals and leaves -->
  <use href="#blossom" transform="translate(70 92) scale(.7)"/>
  <use href="#blossom" transform="translate(132 168) scale(.7)"/>
  <use href="#blossom" transform="translate(64 276) scale(.75)"/>
  <use href="#blossom" transform="translate(126 366) scale(.7)"/>
  <use href="#petal" transform="translate(108 92) rotate(-30)"/>
  <use href="#petal" transform="translate(86 182) rotate(20)"/>
  <use href="#petal" transform="translate(140 274) rotate(-50)"/>
  <use href="#petal" transform="translate(72 370) rotate(35)"/>
  <use href="#leaf" transform="translate(140 104) rotate(60) scale(.7)"/>
  <use href="#leaf" transform="translate(112 260) rotate(-70) scale(.7)"/>
  <use href="#spark" transform="translate(148 14)"/>
  <use href="#spark" transform="translate(96 196) scale(.7)"/>
  <use href="#spark" transform="translate(146 336) scale(.8)"/>

  <!-- camellias along the edge -->
  <use href="#rose" fill="#d2336f" stroke="#f7b4c9" transform="translate(10 28)"/>
  <use href="#rose" fill="#fff" stroke="#ec9ab4" transform="translate(20 76) scale(1.1)"/>
  <use href="#rose" fill="#f9c6d6" stroke="#e0789c" transform="translate(6 120) scale(.8)"/>
  <use href="#rose" fill="#fff" stroke="#ec9ab4" transform="translate(22 162)"/>
  <use href="#rose" fill="#d2336f" stroke="#f7b4c9" transform="translate(8 206) scale(.95)"/>
  <use href="#rose" fill="#fff" stroke="#ec9ab4" transform="translate(18 256) scale(1.05)"/>
  <use href="#rose" fill="#f9c6d6" stroke="#e0789c" transform="translate(6 298) scale(.8)"/>
  <use href="#rose" fill="#d2336f" stroke="#f7b4c9" transform="translate(20 340)"/>
  <use href="#rose" fill="#fff" stroke="#ec9ab4" transform="translate(8 378) scale(.85)"/>
</svg>
