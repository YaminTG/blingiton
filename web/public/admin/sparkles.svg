<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <!-- Scattered gold four-point sparkles, as dotted over the gift bag. Tiles in both directions. -->
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6dc95"/>
      <stop offset=".55" stop-color="#c99a45"/>
      <stop offset="1" stop-color="#a57826"/>
    </linearGradient>
    <path id="spark" d="M0 -6C.8 -1 1 -.8 6 0C1 .8 .8 1 0 6C-.8 1 -1 .8 -6 0C-1 -.8 -.8 -1 0 -6Z" fill="url(#gold)"/>
  </defs>
  <use href="#spark" transform="translate(30 40)"/>
  <use href="#spark" transform="translate(150 22) scale(.6)"/>
  <use href="#spark" transform="translate(196 118) scale(.8)"/>
  <use href="#spark" transform="translate(84 150) scale(.55)"/>
  <use href="#spark" transform="translate(20 206) scale(.7)"/>
  <use href="#spark" transform="translate(166 212) scale(.5)"/>
</svg>
