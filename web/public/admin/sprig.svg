<svg xmlns="http://www.w3.org/2000/svg" width="96" height="64" viewBox="0 0 96 64">
  <!-- Corner sprig from the gift bag: a camellia tucked into the top-right corner with a gold stem,
       leaves and a blossom reaching left. -->
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6dc95"/>
      <stop offset=".55" stop-color="#c99a45"/>
      <stop offset="1" stop-color="#a57826"/>
    </linearGradient>
    <g id="rose" stroke-width="1.3" stroke-linejoin="round">
      <circle cx="0" cy="-12" r="10"/>
      <circle cx="10.4" cy="-6" r="10"/>
      <circle cx="10.4" cy="6" r="10"/>
      <circle cx="0" cy="12" r="10"/>
      <circle cx="-10.4" cy="6" r="10"/>
      <circle cx="-10.4" cy="-6" r="10"/>
      <circle cx="0" cy="0" r="13"/>
      <circle cx="0" cy="-6" r="6"/>
      <circle cx="5.7" cy="-1.9" r="6"/>
      <circle cx="3.5" cy="4.9" r="6"/>
      <circle cx="-3.5" cy="4.9" r="6"/>
      <circle cx="-5.7" cy="-1.9" r="6"/>
      <path d="M0 -1.5a1.5 1.5 0 1 1 -1.5 1.5a3.2 3.2 0 1 0 3.2 -3.2a5 5 0 1 1 -5 5" fill="none"/>
    </g>
    <g id="blossom">
      <circle cx="0" cy="-4.6" r="4" fill="#fff" stroke="#f3b3c8" stroke-width=".8"/>
      <circle cx="4.4" cy="-1.4" r="4" fill="#fff" stroke="#f3b3c8" stroke-width=".8"/>
      <circle cx="2.7" cy="3.7" r="4" fill="#fff" stroke="#f3b3c8" stroke-width=".8"/>
      <circle cx="-2.7" cy="3.7" r="4" fill="#fff" stroke="#f3b3c8" stroke-width=".8"/>
      <circle cx="-4.4" cy="-1.4" r="4" fill="#fff" stroke="#f3b3c8" stroke-width=".8"/>
      <circle r="2.4" fill="#f5a3bf"/>
    </g>
    <path id="leaf" d="M0 0C4 -6 11 -7.5 18 -4.5C12 0.5 5 2.5 0 0Z" fill="url(#gold)"/>
    <path id="spark" d="M0 -6C.8 -1 1 -.8 6 0C1 .8 .8 1 0 6C-.8 1 -1 .8 -6 0C-1 -.8 -.8 -1 0 -6Z" fill="url(#gold)"/>
  </defs>
  <path d="M70 26C54 30 38 32 18 30" fill="none" stroke="#c9a052" stroke-width="1.2" stroke-linecap="round"/>
  <use href="#leaf" transform="translate(56 29) rotate(200)"/>
  <use href="#leaf" transform="translate(40 31) rotate(150) scale(.85)"/>
  <use href="#blossom" transform="translate(14 30) scale(.9)"/>
  <use href="#blossom" transform="translate(48 50) scale(.65)"/>
  <use href="#spark" transform="translate(26 10) scale(.8)"/>
  <use href="#rose" fill="#fff" stroke="#ec9ab4" transform="translate(84 14) scale(.95)"/>
  <use href="#rose" fill="#d2336f" stroke="#f7b4c9" transform="translate(90 46) scale(.7)"/>
</svg>
